[package]
name = "xmip-core-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-audit"
description = "Configurable audit lifecycle records for every Xmip action and every Xmip program: the sink seam, the fallback to the operating system's log the program hands in when audit cannot persist (ADR-0062), and the audit file's one reader."

[dependencies]
# uuid-v7: an audit record's identifier is minted here, as every Xmip
# identifier is, by xmip-core's one generator; and each record chained to
# the one before it in its writer's audit chain by xmip-core's one rule,
# over the SHA-256 of its canonical form (xcore::audit_chain, ADR-0070
# clause 5).
xcore = { workspace = true, features = ["uuid-v7"] }
# The estate's encoding primitives: a record is written as TOML (quoted by
# codec's one quoting) and stamped by the civil calendar.
codec = { workspace = true }

# The one scope rule and the one wildcard: a reader asks who a record is by
# the location its process declared, and filters by the pattern every
# surface filters with (ADR-0062, amendment 2026-09-29).
node = { workspace = true }

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`).
configure = { workspace = true, features = ["test-support"] }

# The timing program's fastest of five, said as every timing program says
# it (`xcore::latency::spread`).
xcore = { workspace = true, features = ["uuid-v7", "test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
